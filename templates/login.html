<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素心园 - 掌园归家</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, opacity 0.4s ease;
        }

        :root {
            --ink-deep: #1a1814;
            --ink-mid: #4a4844;
            --ink-light: #7a7874;
            --ink-soft: #b0aea8;
            --paper-bg: #faf8f3;
            --paper-card: #f5f3ee;
            --bamboo-green: #4a6741;
            --seal-red: #8b2020;
            --painting-opacity: 0.09;
        }

        .dark-theme {
            --ink-deep: #f2f0ea;
            --ink-mid: #d3d1ca;
            --ink-light: #8d8a84;
            --ink-soft: #3a3d42;
            --paper-bg: #16181b;
            --paper-card: #22252a;
            --bamboo-green: #6b9461;
            --seal-red: #a63a3a;
            --painting-opacity: 0.05;
        }

        body {
            min-height: 100vh;
            background: var(--paper-bg);
            color: var(--ink-mid);
            font-family: "Noto Serif SC", "Source Han Serif", "STSong", serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            letter-spacing: 1px;
            position: relative;
        }

        .pc-painting {
            position: fixed;
            top: 8%;
            width: 280px;
            height: 80vh;
            pointer-events: none;
            z-index: 1;
            opacity: var(--painting-opacity);
        }

        .painting-left { left: 20px; }
        .painting-right { right: 20px; }
        .lotus-pond { display: block; }
        .bamboo-forest { display: none; }
        .dark-theme .lotus-pond { display: none; }
        .dark-theme .bamboo-forest { display: block; }

        .login-scroll {
            width: 100%;
            max-width: 500px;
            background: var(--paper-bg);
            border: 1px solid var(--ink-soft);
            padding: 46px 40px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            z-index: 2;
        }

        .bg-bamboo-shadow {
            position: absolute;
            left: 24px;
            bottom: 10px;
            font-size: 92px;
            color: var(--bamboo-green);
            opacity: 0.05;
            user-select: none;
        }

        .theme-toggle-corner {
            position: absolute;
            top: 18px;
            right: 18px;
        }

        .btn-mini-theme {
            font-family: inherit;
            font-size: 13px;
            border: 1px solid var(--ink-soft);
            background: transparent;
            color: var(--ink-light);
            padding: 4px 10px;
            cursor: pointer;
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-title {
            font-size: 30px;
            color: var(--ink-deep);
            letter-spacing: 6px;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: var(--ink-light);
            letter-spacing: 2px;
        }

        .error-box {
            margin-bottom: 20px;
            padding: 12px 14px;
            background: #fff4f4;
            border-left: 4px solid var(--seal-red);
            color: var(--ink-deep);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            color: var(--ink-mid);
            font-weight: 700;
            letter-spacing: 2px;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--ink-soft);
            background: var(--paper-card);
            color: var(--ink-deep);
            font-family: inherit;
            font-size: 17px;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--ink-deep);
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--ink-light);
            font-size: 14px;
            margin-top: -6px;
        }

        .remember-row input {
            width: 16px;
            height: 16px;
            accent-color: var(--seal-red);
        }

        .login-actions {
            margin-top: 34px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-submit-login {
            width: 100%;
            font-family: inherit;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 6px;
            padding: 12px 0;
            background: var(--ink-deep);
            color: var(--paper-bg);
            border: none;
            cursor: pointer;
        }

        .btn-back-home {
            text-align: center;
            color: var(--ink-light);
            text-decoration: none;
            padding: 8px 0;
        }

        @media (max-width: 1340px) {
            .pc-painting { display: none !important; }
        }
    </style>
</head>
<body>
{% include "_paintings.html" %}

<div class="login-scroll">
    <div class="bg-bamboo-shadow">竹</div>

    <div class="theme-toggle-corner">
        <button class="btn-mini-theme" id="themeBtn" onclick="toggleTheme()">切换：夜读</button>
    </div>

    <header class="login-header">
        <h1 class="login-title">见字如面</h1>
        <p class="login-subtitle">掌园归家 · 轻推柴门</p>
    </header>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post">
        <div class="form-group">
            <label class="form-label" for="username">后台账号</label>
            <input class="form-input" type="text" id="username" name="username" autocomplete="username" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">后台密码</label>
            <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <div class="remember-row">
            <input type="checkbox" id="remember_login" name="remember_login" value="1">
            <label for="remember_login">记住登录状态（30天）</label>
        </div>

        <div class="login-actions">
            <button type="submit" class="btn-submit-login">推门而入</button>
            <a class="btn-back-home" href="{{ url_for('index') }}">返回首页</a>
        </div>
    </form>
</div>

<script>
    (function () {
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-theme");
        }
        syncThemeButton();
    })();

    function toggleTheme() {
        document.body.classList.toggle("dark-theme");
        localStorage.setItem("theme", document.body.classList.contains("dark-theme") ? "dark" : "light");
        syncThemeButton();
    }

    function syncThemeButton() {
        document.getElementById("themeBtn").textContent = document.body.classList.contains("dark-theme") ? "切换：白日" : "切换：夜读";
    }
</script>
</body>
</html>
