<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素心园 - 关于</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, opacity 0.4s ease;
        }

        :root {
            --ink-deep: #1a1814;
            --ink-mid: #4a4844;
            --ink-light: #7a7874;
            --ink-soft: #b0aea8;
            --paper-bg: #faf8f3;
            --paper-card: #f5f3ee;
            --bamboo-green: #4a6741;
            --seal-red: #8b2020;
            --header-gradient: linear-gradient(to bottom, #f3f0e8 0%, #faf8f3 100%);
            --bg-opacity: 0.03;
            --painting-opacity: 0.09;
        }

        .dark-theme {
            --ink-deep: #f2f0ea;
            --ink-mid: #c7c5be;
            --ink-light: #8d8a84;
            --ink-soft: #3a3d42;
            --paper-bg: #16181b;
            --paper-card: #22252a;
            --bamboo-green: #6b9461;
            --seal-red: #a63a3a;
            --header-gradient: linear-gradient(to bottom, #101113 0%, #16181b 100%);
            --bg-opacity: 0.06;
            --painting-opacity: 0.05;
        }

        body {
            background: var(--paper-bg);
            color: var(--ink-mid);
            font-family: "Noto Serif SC", "Source Han Serif", "STSong", serif;
            line-height: 2;
            letter-spacing: 1px;
            padding: 32px 20px 60px;
            position: relative;
        }

        .pc-painting {
            position: fixed;
            top: 8%;
            width: 280px;
            height: 80vh;
            pointer-events: none;
            z-index: 1;
            opacity: var(--painting-opacity);
        }

        .painting-left { left: 20px; }
        .painting-right { right: 20px; }
        .lotus-pond { display: block; }
        .bamboo-forest { display: none; }
        .dark-theme .lotus-pond { display: none; }
        .dark-theme .bamboo-forest { display: block; }

        .scroll-container {
            max-width: 1040px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .header {
            background: var(--header-gradient);
            padding: 56px 40px 34px;
            border-radius: 8px 8px 0 0;
            position: relative;
            overflow: hidden;
        }

        .header-bg-char {
            position: absolute;
            right: 36px;
            top: -18px;
            font-size: 200px;
            color: var(--ink-deep);
            opacity: var(--bg-opacity);
            line-height: 1;
            user-select: none;
        }

        .blog-title-wrap {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 12px;
        }

        .blog-title {
            font-size: 42px;
            font-weight: 700;
            color: var(--ink-deep);
            letter-spacing: 8px;
        }

        .seal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 54px;
            height: 42px;
            padding: 0 8px;
            border: 3px double var(--seal-red);
            color: var(--seal-red);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .blog-subtitle {
            color: var(--ink-light);
            letter-spacing: 4px;
            margin-bottom: 34px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid var(--ink-deep);
            padding-bottom: 12px;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
        }

        .nav-item {
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            color: var(--ink-mid);
            position: relative;
            padding: 4px 0;
        }

        .nav-item.active {
            color: var(--ink-deep);
        }

        .nav-item.active::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -14px;
            width: 100%;
            height: 4px;
            background: var(--bamboo-green);
        }

        .header-actions {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .btn-toggle-theme,
        .btn-admin-entrance,
        .channel-link {
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 18px;
            letter-spacing: 2px;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-toggle-theme {
            border: 1px solid var(--ink-soft);
            background: var(--paper-card);
            color: var(--ink-deep);
        }

        .btn-admin-entrance {
            border: 1px solid var(--seal-red);
            color: var(--seal-red);
            background: transparent;
        }

        .page-layout {
            padding: 40px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 34px;
        }

        .paper-panel {
            background: var(--paper-card);
            border: 1px solid var(--ink-soft);
            padding: 28px 24px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--ink-deep);
            border-left: 4px solid var(--ink-deep);
            padding-left: 12px;
            line-height: 1.2;
            margin-bottom: 18px;
        }

        .intro-copy {
            font-size: 17px;
            color: var(--ink-mid);
        }

        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .channel-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            border: 1px solid var(--ink-soft);
            background: #fff;
        }

        .dark-theme .channel-card {
            background: #1d2025;
        }

        .channel-name {
            color: var(--ink-deep);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .channel-note {
            color: var(--ink-light);
            font-size: 14px;
        }

        .channel-link {
            border: 1px solid var(--seal-red);
            color: var(--seal-red);
            background: transparent;
            white-space: nowrap;
        }

        .channel-link:hover,
        .btn-admin-entrance:hover {
            background: var(--seal-red);
            color: var(--paper-bg);
        }

        .quote-box {
            font-size: 17px;
            color: var(--ink-deep);
        }

        @media (max-width: 1340px) {
            .pc-painting { display: none !important; }
        }

        @media (max-width: 900px) {
            .page-layout {
                grid-template-columns: 1fr;
                padding: 28px 20px;
            }

            .header {
                padding: 44px 24px 28px;
            }

            .nav-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
{% include "_paintings.html" %}

<div class="scroll-container">
    <header class="header">
        <div class="header-bg-char">墨</div>
        <div class="blog-title-wrap">
            <h1 class="blog-title">素心园</h1>
            <span class="seal">引</span>
        </div>
        <p class="blog-subtitle">关于小园 · 去向与联络</p>

        <div class="nav-bar">
            <nav class="nav-links">
                <a href="{{ url_for('index') }}" class="nav-item">首页</a>
                <a href="{{ url_for('index') }}#post-list-section" class="nav-item">文章</a>
                <a href="{{ url_for('about') }}" class="nav-item active">关于</a>
            </nav>
            <div class="header-actions">
                <button class="btn-toggle-theme" id="themeBtn" onclick="toggleTheme()">切换：夜读</button>
                <a href="{{ url_for('login') }}" class="btn-admin-entrance">掌园入口</a>
            </div>
        </div>
    </header>

    <div class="page-layout">
        <section class="paper-panel">
            <h2 class="section-title">小园一角</h2>
            <p class="intro-copy">这里放小园相关的外部去处。你之后只要把下面这些链接替换成自己的真实地址就行，不用改页面结构。</p>
        </section>

        <section class="paper-panel">
            <h2 class="section-title">案头一句</h2>
            <p class="quote-box">“{{ quote }}”</p>
        </section>

        <section class="paper-panel" style="grid-column: 1 / -1;">
            <h2 class="section-title">园外去处</h2>
            <div class="channel-list">
                {% for link in links %}
                <div class="channel-card">
                    <div>
                        <div class="channel-name">{{ link.name }}</div>
                        <div class="channel-note">{{ link.url }}</div>
                    </div>
                    <a class="channel-link" href="{{ link.url }}" target="_blank" rel="noreferrer">前往</a>
                </div>
                {% endfor %}
            </div>
        </section>
    </div>
</div>

<script>
    (function () {
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-theme");
        }
        syncThemeButton();
    })();

    function toggleTheme() {
        document.body.classList.toggle("dark-theme");
        localStorage.setItem("theme", document.body.classList.contains("dark-theme") ? "dark" : "light");
        syncThemeButton();
    }

    function syncThemeButton() {
        document.getElementById("themeBtn").textContent = document.body.classList.contains("dark-theme") ? "切换：白日" : "切换：夜读";
    }
</script>
</body>
</html>
